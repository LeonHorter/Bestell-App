<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellAPP</title>
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="style.css">
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body onload="renderMeals()">
    <header class="mainHeader">
        <div class="contentWrapper headerContent">
            <a href="index.html"><img src="./assets/icons/logo.svg" alt="BestellAPP-Logo"></a>
            <button class="menuBtn"></button>
        </div>
    </header>
    <main>
        <section id="hero">
            <img src="./assets/img/hero.png" alt="Titelbild" class="heroImg">
            <img src="./assets/img/restaurant_logo.png" alt="Restaurant-Logo" class="restaurantLogoImg">
            <div class="contentWrapper heroContent">
                <div class="headline">
                    <h1><span class="orangeHeadline">Burger</span>House</h1>
                    <div class="review">
                        <img src="./assets/icons/star.svg" alt="Stern-Icon">
                        <p class="reviewStars">4,1</p>
                        <p class="reviewAmount">(317)</p>
                    </div>
                </div>
                <p class="heroText">The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </section>
        <section class="category">
            <header>
                <div class="categoryHeaderContent contentWrapper">
                    <img src="./assets/img/burger.png" alt="Burger" class="categoryImg">
                    <h2>Burger & Sandwiches</h2>
                </div>
            </header>
            <div id="burger" class="mealsContent contentWrapper"></div>
        </section>
        <section class="category">
            <header>
                <div class="categoryHeaderContent contentWrapper">
                    <img src="./assets/img/pizza.png" alt="Pizza" class="categoryImg">
                    <h2>Pizza <span class="fontPalanquinRegular">(30 cm)</span></h2>
                </div>
            </header>
            <div id="pizza" class="mealsContent contentWrapper"></div>
        </section>
        <section class="category">
            <header>
                <div class="categoryHeaderContent contentWrapper">
                    <img src="./assets/img/salad.png" alt="Salad" class="categoryImg">
                    <h2>Salad</h2>
                </div>
            </header>
            <div id="salad" class="mealsContent contentWrapper"></div>
        </section>
    </main>
    <footer class="mainFooter">
        <div class="contentWrapper footerContent">
            <figure>
                <img src="./assets/icons/copyright.svg" alt="Copyright-Logo">
                <figcaption>2025 BurgerHouse</figcaption>
            </figure>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
</body>

</html>
